when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: validate
    when:
      - event: pull_request
      - event: push
        branch: master
    image: node:22-alpine
    commands:
      - apk add --no-cache poppler-utils
      - npm ci
      - npm run lint
      - npm run typecheck
      - npm run test
      - npm run generate
      - npm run route:validate
      - npm run resume:verify

  - name: build-portfolio
    when:
      - event: push
        branch: master
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/elagala/portfolio
      username:
        from_secret: gh_username
      password:
        from_secret: gh_token
      tags:
        - ${CI_COMMIT_SHA}
      build_args:
        VCS_REF: ${CI_COMMIT_SHA}
