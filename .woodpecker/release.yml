when:
  - event: deployment
    branch: master
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "portfolio_production"'

steps:
  - name: resolve-approved-image
    image: gcr.io/go-containerregistry/crane/debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
    entrypoint:
      - /busybox/sh
      - -c
      - echo $CI_SCRIPT | base64 -d | /busybox/sh -e
    environment:
      RELEASE_IMAGE_FILE: .release/image.txt
    commands:
      - /busybox/sh deploy/resolve-release-image.sh

  - name: release-approved-image
    image: ghcr.io/agala-labs/ansible-runner@sha256:e78c571e9dd3008b70245c5bce0d92c3d8e0aecd1d6d3a3e03ea34bb8bd09f59
    environment:
      AGALA_RUNNER_MODE: k3s-release
      RELEASE_SERVICE: portfolio-site
      RELEASE_IMAGE_FILE: .release/image.txt
      RELEASE_SOURCE_SHA: ${CI_COMMIT_SHA}
      RELEASE_IAC_REVISION: 30e10e02ab39c9113365fea731bbbad01c88d6c1
      INFISICAL_HOST: https://vault.agala.com.ar
      INFISICAL_PROJECT_ID: c5347389-7c2c-4b3d-8312-7de0d0158560
      INFISICAL_CLIENT_ID:
        from_secret: infisical_k3s_release_client_id
      INFISICAL_CLIENT_SECRET:
        from_secret: infisical_k3s_release_client_secret
      PLATFORM_GIT_TOKEN:
        from_secret: platform_git_release_token

# Woodpecker 3.13 rejects workflow-level concurrency. The platform publisher's
# protected force-with-lease fails closed if another release updates Git first.
